# Hetzner Cluster Autoscaler for teiwah (eu-central / teiwah-private).
#
# Provisioning model: the autoscaler calls the Hetzner API itself and runs the cloud-init
# from the hcloud-autoscaler secret (see apply.sh). New nodes register as hcloud:// on
# teiwah-private exactly like the manual proof.
#
# Pools: cost-optimized CX only, cheapest first (cx23 → cx33 → cx43), EU-only because only
# eu-central can attach to teiwah-private. CPX removed — post-June 2026 pricing makes it
# worse value than larger CX tiers. Availability: 3 regions per type before falling to next
# tier. max=250/pool ≈ uncapped (real ceiling = Hetzner project quota).
#
# IMPORTANT: match the image tag to the cluster minor (kubectl version -> v1.35.x).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "persistentvolumeclaims", "persistentvolumes", "replicationcontrollers"]
    verbs: ["watch", "list", "get"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["update", "patch"]
  - apiGroups: ["extensions", "apps"]
    resources: ["replicasets", "statefulsets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  # Required on Kubernetes 1.35+ — without these the autoscaler main loop never
  # becomes healthy (cluster_safe_to_autoscale stays 0, no scale-up for overprovisioning).
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceclaims", "resourceslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "watch", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
# Preference order. Higher number = more preferred. Names are regex-matched against the
# node-group (pool) names below. When a tier is unavailable/in-backoff, the next is used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-priority-expander
  namespace: kube-system
data:
  priorities: |-
    30:
      - ".*cx23.*"
    20:
      - ".*cx33.*"
    10:
      - ".*cx43.*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      serviceAccountName: cluster-autoscaler
      # Run on the control-plane (where HCCM also runs).
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - ./cluster-autoscaler
            - --cloud-provider=hetzner
            - --expander=priority
            # min:max:instanceType:region:poolName  (max 250 ≈ uncapped)
            # tier 1 — cx23 (cheapest, 4 GB — matches teiwah-worker)
            - --nodes=0:250:cx23:nbg1:teiwah-cx23-nbg1
            - --nodes=0:250:cx23:fsn1:teiwah-cx23-fsn1
            - --nodes=0:250:cx23:hel1:teiwah-cx23-hel1
            # tier 2 — cx33 (8 GB)
            - --nodes=0:250:cx33:nbg1:teiwah-cx33-nbg1
            - --nodes=0:250:cx33:fsn1:teiwah-cx33-fsn1
            - --nodes=0:250:cx33:hel1:teiwah-cx33-hel1
            # tier 3 — cx43 (16 GB, last resort before scale-up fails)
            - --nodes=0:250:cx43:nbg1:teiwah-cx43-nbg1
            - --nodes=0:250:cx43:fsn1:teiwah-cx43-fsn1
            - --nodes=0:250:cx43:hel1:teiwah-cx43-hel1
            - --scale-down-delay-after-add=10m
            - --scale-down-unneeded-time=10m
            - --scan-interval=10s
            - --v=4
          env:
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hcloud-autoscaler
                  key: token
            - name: HCLOUD_CLOUD_INIT
              valueFrom:
                secretKeyRef:
                  name: hcloud-autoscaler
                  key: cloudInit
            # Attach new nodes to teiwah-private (so they get a 10.0.0.x InternalIP via HCCM).
            - name: HCLOUD_NETWORK
              value: "teiwah-private"
            - name: HCLOUD_IMAGE
              value: "ubuntu-24.04"
            # Keep public IPv4 so nodes reach the internet directly (no bastion/NAT).
            - name: HCLOUD_PUBLIC_IPV4
              value: "true"
            - name: HCLOUD_PUBLIC_IPV6
              value: "false"
            # Optional: set to a Hetzner SSH key NAME to allow SSH into autoscaled nodes.
            # - name: HCLOUD_SSH_KEY
            #   value: "your-ssh-key-name"
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 300Mi
