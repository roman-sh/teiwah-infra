# systemd drop-in for the OliveTin .deb service so it runs with cluster access.
#
# The .deb runs OliveTin as an unprivileged `olivetin` user that can't read the
# k3s admin kubeconfig or root's repo. This override runs it as root with the
# kubeconfig + a sane PATH so the `make`/kubectl actions work like an SSH shell.
#
# Install (on teiwah-master):
#   mkdir -p /etc/systemd/system/OliveTin.service.d
#   cp /root/teiwah-infra/olivetin/olivetin.service.override.conf \
#      /etc/systemd/system/OliveTin.service.d/override.conf
#   systemctl daemon-reload && systemctl restart OliveTin

[Service]
User=root
Group=root
Environment=KUBECONFIG=/etc/rancher/k3s/k3s.yaml
Environment=PATH=/usr/local/bin:/usr/bin:/bin
