# Teiwah ops panel (OliveTin).
#
# Each button runs a teiwah-infra Makefile target in the SAME environment as an
# SSH shell on teiwah-master (same kubectl, kubeconfig, repo). It is just a GUI
# trigger for the `make` targets you'd otherwise type by hand.
#
# SECURITY: this panel has cluster-admin (it runs kubectl as root). It is exposed
# ONLY through the Cloudflare Tunnel + Access at https://infra.teiwah.cloud, and
# binds to 127.0.0.1 so it is never directly reachable. Do NOT expose :1337 any
# other way. See ./README.md for install + the Cloudflare setup.
#
# The UI uses only dropdown/checklist choices generated by our scripts plus
# confirmation inputs — no free-text fields — so argument values are constrained.

pageTitle: "Teiwah ops"

# Bind to localhost only; cloudflared (same host) proxies the tunnel to this.
ListenAddressSingleHTTPFrontend: 127.0.0.1:1337

# Always open the execution dialog so you see stdout/stderr, exit code, timing.
defaultOnClick: execution-dialog

# Repo checkout on teiwah-master (root's home). Adjust REPO below if yours differs,
# then update each action's `make -C` path to match.

entities:
  - file: entities/cleanup-sessions.jsonl
    name: cleanupSession

actions:
  - title: "List pods"
    shell: "make --no-print-directory -C /root/teiwah-infra pods NAMESPACE={{ namespace }}"
    timeout: 60
    arguments:
      - name: namespace
        title: "Namespace"
        choices:
          - title: "sandbox (dev)"
            value: sandbox
          - title: "default (prod)"
            value: default

  - title: "Restart all workers"
    shell: "make --no-print-directory -C /root/teiwah-infra worker-restart-all NAMESPACE={{ namespace }}"
    timeout: 900
    arguments:
      - name: namespace
        title: "Namespace"
        choices:
          - title: "sandbox (dev)"
            value: sandbox
          - title: "default (prod)"
            value: default

  - title: "Sandbox setup (dev namespace + GHCR pull secret)"
    shell: "make --no-print-directory -C /root/teiwah-infra sandbox-setup"
    timeout: 120

  - title: "Refresh cleanup session list"
    shell: "make --no-print-directory -C /root/teiwah-infra cleanup-list-refresh NS={{ namespace }}"
    timeout: 120
    arguments:
      - name: namespace
        title: "Namespace to scan"
        choices:
          - title: "sandbox (dev)"
            value: sandbox
          - title: "default (prod)"
            value: default

  - title: "FULL HARD DELETE selected sessions"
    shell: "make --no-print-directory -C /root/teiwah-infra cleanup-selected-hard NS={{ namespace }} SESSIONS='{{ sessions }}'"
    timeout: 900
    arguments:
      - name: namespace
        title: "Namespace"
        choices:
          - title: "sandbox (dev)"
            value: sandbox
          - title: "default (prod)"
            value: default
      - name: sessions
        title: "Sessions to permanently delete"
        type: checklist
        entity: cleanupSession
        rejectNull: true
        choices:
          - value: "{{ cleanupSession.Value }}"
            title: "{{ cleanupSession.Title }}"
      - type: confirmation
        title: "Yes — permanently delete selected sessions from Zuplo, k8s/PVCs, and DB"
