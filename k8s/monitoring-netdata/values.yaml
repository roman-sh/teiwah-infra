# Netdata trial for teiwah — NON-DESTRUCTIVE, runs alongside kube-prometheus-stack.
# Purpose: a 10-minute UX evaluation (sortable node/pod CPU+RAM grids, zero query language).
# Local-only: no Netdata Cloud claim (claiming.enabled defaults to false in the chart).
#
# Storage is EPHEMERAL on purpose so `helm uninstall` leaves nothing behind. If you DECIDE
# TO KEEP Netdata, flip these persistence flags back to true so history (avg/peak) survives
# restarts — the default `local-path` StorageClass will provision the PVCs.

parent:
  # One parent aggregates every child node into a single UI; pin to the static control-plane
  # like HCCM / cluster-autoscaler / the prometheus agent.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists
  database:
    persistence: false
  alarms:
    persistence: false

child:
  # DaemonSet — one agent per node, including the master and any future autoscaled worker
  # (same auto-cover-new-nodes behaviour as your existing node-exporter).
  tolerations:
    - operator: Exists
  persistence:
    enabled: false

k8sState:
  persistence:
    enabled: false
